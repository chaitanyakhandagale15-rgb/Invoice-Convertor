<svg width="860" height="220" viewBox="0 0 860 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0f0c29"/>
      <stop offset="50%"  stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FF6B35"/>
      <stop offset="50%"  stop-color="#F7931E"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FF6B35" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#FF6B35" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#FFD700" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="220" fill="url(#bgGrad)" rx="14"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="40"  x2="860" y2="40"/>
    <line x1="0" y1="80"  x2="860" y2="80"/>
    <line x1="0" y1="120" x2="860" y2="120"/>
    <line x1="0" y1="160" x2="860" y2="160"/>
    <line x1="0" y1="200" x2="860" y2="200"/>
    <line x1="86"  y1="0" x2="86"  y2="220"/>
    <line x1="172" y1="0" x2="172" y2="220"/>
    <line x1="258" y1="0" x2="258" y2="220"/>
    <line x1="344" y1="0" x2="344" y2="220"/>
    <line x1="430" y1="0" x2="430" y2="220"/>
    <line x1="516" y1="0" x2="516" y2="220"/>
    <line x1="602" y1="0" x2="602" y2="220"/>
    <line x1="688" y1="0" x2="688" y2="220"/>
    <line x1="774" y1="0" x2="774" y2="220"/>
  </g>

  <!-- Glowing orb top-left -->
  <circle cx="80" cy="55" r="55" fill="#FF6B35" opacity="0.07" filter="url(#softglow)">
    <animate attributeName="r" values="55;65;55" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.07;0.12;0.07" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Glowing orb bottom-right -->
  <circle cx="790" cy="170" r="60" fill="#FFD700" opacity="0.06" filter="url(#softglow)">
    <animate attributeName="r" values="60;72;60" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.06;0.11;0.06" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Invoice icon (left decorative) -->
  <g transform="translate(54, 82)" opacity="0" filter="url(#glow)">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.2s" fill="freeze"/>
    <rect x="0" y="0" width="28" height="36" rx="3" fill="none" stroke="#FF6B35" stroke-width="1.5"/>
    <line x1="5" y1="10" x2="23" y2="10" stroke="#FF6B35" stroke-width="1.2" opacity="0.7"/>
    <line x1="5" y1="16" x2="23" y2="16" stroke="#FF6B35" stroke-width="1.2" opacity="0.7"/>
    <line x1="5" y1="22" x2="15" y2="22" stroke="#FF6B35" stroke-width="1.2" opacity="0.7"/>
    <text x="14" y="34" text-anchor="middle" font-size="8" fill="#FFD700" font-family="monospace">₹</text>
  </g>

  <!-- Main title: InvoiceBridge -->
  <text x="430" y="90"
        text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="48"
        font-weight="800"
        letter-spacing="2"
        fill="url(#textGrad)"
        filter="url(#glow)"
        opacity="0">
    🧾 InvoiceBridge
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
                      values="0 15; 0 0" dur="0.8s" begin="0.1s" fill="freeze" additive="sum"/>
  </text>

  <!-- Animated underline -->
  <rect x="230" y="99" width="0" height="2.5" rx="1.5" fill="url(#lineGrad)">
    <animate attributeName="width" values="0;400" dur="0.9s" begin="0.6s" fill="freeze"/>
    <animate attributeName="x"     values="430;230" dur="0.9s" begin="0.6s" fill="freeze"/>
  </rect>

  <!-- Subtitle line 1 -->
  <text x="430" y="133"
        text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="15"
        fill="#c0b8e8"
        letter-spacing="0.5"
        opacity="0">
    Multi-Country GST Invoice Converter · OCR · Live Exchange Rates · Server-Generated PDFs
    <animate attributeName="opacity" values="0;1" dur="0.7s" begin="1.1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
                      values="0 12; 0 0" dur="0.7s" begin="1.1s" fill="freeze" additive="sum"/>
  </text>

  <!-- Pill tags row -->
  <!-- React pill -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.6s" fill="freeze"/>
    <rect x="192" y="152" width="64" height="24" rx="12" fill="#61DAFB" opacity="0.15"/>
    <rect x="192" y="152" width="64" height="24" rx="12" fill="none" stroke="#61DAFB" stroke-width="1" opacity="0.6"/>
    <text x="224" y="168" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#61DAFB">⚛ React</text>
  </g>

  <!-- Express pill -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.75s" fill="freeze"/>
    <rect x="264" y="152" width="72" height="24" rx="12" fill="#ffffff" opacity="0.08"/>
    <rect x="264" y="152" width="72" height="24" rx="12" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
    <text x="300" y="168" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#e0e0e0">Express 5</text>
  </g>

  <!-- PostgreSQL pill -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.9s" fill="freeze"/>
    <rect x="344" y="152" width="88" height="24" rx="12" fill="#4169E1" opacity="0.15"/>
    <rect x="344" y="152" width="88" height="24" rx="12" fill="none" stroke="#4169E1" stroke-width="1" opacity="0.6"/>
    <text x="388" y="168" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#7B9EF0">🐘 PostgreSQL</text>
  </g>

  <!-- Clerk pill -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.05s" fill="freeze"/>
    <rect x="440" y="152" width="58" height="24" rx="12" fill="#6C47FF" opacity="0.2"/>
    <rect x="440" y="152" width="58" height="24" rx="12" fill="none" stroke="#6C47FF" stroke-width="1" opacity="0.7"/>
    <text x="469" y="168" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#A78BFA">🔐 Clerk</text>
  </g>

  <!-- TypeScript pill -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.2s" fill="freeze"/>
    <rect x="506" y="152" width="82" height="24" rx="12" fill="#3178C6" opacity="0.18"/>
    <rect x="506" y="152" width="82" height="24" rx="12" fill="none" stroke="#3178C6" stroke-width="1" opacity="0.6"/>
    <text x="547" y="168" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#5B9BD5">TS 5.9</text>
  </g>

  <!-- pdfkit pill -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.35s" fill="freeze"/>
    <rect x="596" y="152" width="68" height="24" rx="12" fill="#FF6B35" opacity="0.15"/>
    <rect x="596" y="152" width="68" height="24" rx="12" fill="none" stroke="#FF6B35" stroke-width="1" opacity="0.6"/>
    <text x="630" y="168" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#FF8C5A">📄 pdfkit</text>
  </g>

  <!-- Blinking cursor -->
  <rect x="653" y="153" width="2.5" height="20" rx="1" fill="#FF6B35">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" begin="2.5s"/>
  </rect>

  <!-- Bottom border glow line -->
  <rect x="0" y="216" width="860" height="4" rx="2" fill="url(#lineGrad)" opacity="0.6"/>
</svg>
